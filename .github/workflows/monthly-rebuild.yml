name: Monthly Rebuild

on:
  schedule:
    # 1st of every month, 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch: {}

jobs:
  trigger-netlify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build hook
        run: curl -fsS -X POST "${{ secrets.NETLIFY_BUILD_HOOK }}"
